name: Deliver Lakbay release alerts
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lakbay-production-release-alerts
  cancel-in-progress: true
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for this production deployment, then deliver queued alerts
        env:
          LAKBAY_PRODUCTION_URL: ${{ vars.LAKBAY_PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/dispatch-release-push.mjs
